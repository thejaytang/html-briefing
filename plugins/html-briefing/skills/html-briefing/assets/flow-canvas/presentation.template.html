input:{title:'我们有什么',role:'输入',takeaway:'反馈散落在不同地方，<br>问题与证据还没有连起来。',visual:['客服工单','用户访谈','产品日志'],detail:'<p><strong>当前业务阶段：</strong>团队收到了用户反馈，但同一个问题可能使用不同表述，也可能被重复记录。</p><p>本案例用“导出报表失败”这条反馈贯穿后续步骤。这里的内容均为虚构示例。</p>',tree:'steps'},

prepare:{title:'整理成可用证据',role:'步骤 1',takeaway:'先解决“说的是否是同一个问题”。',visual:['统一字段','合并重复','保留来源'],detail:'<p><strong>核心阻塞：</strong>工单、访谈与日志的粒度不同，直接计数会重复计算。</p><p><strong>解决办法：</strong>统一问题、时间、来源字段；将重复反馈关联起来，同时保留原始记录。</p>',summary:'口径不一致 → 统一字段，保留原始来源。'},

data:{title:'证据可靠吗',role:'数据科学',takeaway:'“导出失败”的反馈，<br>是否重复、是否集中于同一版本？',visual:['去重','分组','追溯'],detail:'<p><strong>检查：</strong>同一用户的重复工单合并计数；按产品版本查看问题是否集中出现。</p><p><strong>边界：</strong>反馈集中出现只能支持进一步排查，不能直接证明版本变更造成故障。</p>',tree:'evidence'},

$('nav-shell').addEventListener('pointerleave',()=>{const active=document.activeElement;if($('nav-shell').contains(active)&&!active.matches(':focus-visible'))$('viewport').focus({preventScroll:true});});
$('language').onclick=()=>{toast('当前演示仅提供中文。');$('viewport').focus({preventScroll:true});};
media.addEventListener('change',e=>{reduced=e.matches;});
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{toast('当前预览不支持全屏，可在浏览器中打开 HTML。');}finally{$('viewport').focus({preventScroll:true});}};
document.addEventListener('fullscreenchange',()=>{const on=!!document.fullscreenElement;$('fullscreen').innerHTML=icon(on?'exit':'fullscreen');$('fullscreen').setAttribute('aria-label',on?'退出全屏':'进入全屏');$('fullscreen').title=on?'退出全屏':'进入全屏';});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){$('viewport').focus({preventScroll:true});return;}
  if(e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,[contenteditable=true]'))return;
  const key=e.key.length===1?e.key.toLowerCase():e.key;
  const dirs={ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0],ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1]};
  if(dirs[key]){e.preventDefault();pan(...dirs[key]);}
  else if(['1','4','9'].includes(key)){e.preventDefault();setSize(Math.sqrt(+key));}
  else if(['+','='].includes(key)){e.preventDefault();setSize(state.view.size-1);}
  else if(['-','_'].includes(key)){e.preventDefault();setSize(state.view.size+1);}
});
function continuous(col,row){state.view=CanvasModel.clampView({...state.view,col,row},scene);camera={x:state.view.col*W,y:state.view.row*H,size:state.view.size};draw();$('viewport').classList.add('moving');}
function stopAnimation(){cameraMotion=null;if(!layoutMotion){cancelAnimationFrame(frame);frame=0;}draw();updateControls();}
$('stage').addEventListener('pointerdown',e=>{const scroll=e.target.closest('.card-content');if(state.view.size===1&&e.pointerType==='touch'&&scroll&&scroll.scrollHeight>scroll.clientHeight+1&&!e.target.closest('button')){detailDrag={element:scroll,y:e.clientY,top:scroll.scrollTop,pointerId:e.pointerId};return;}if(e.button!==0||e.target.closest('button,.detail-text')||(state.view.size===1&&e.target.closest('.card-content')?.scrollHeight>e.target.closest('.card-content')?.clientHeight+1))return;cancelGesture();stopAnimation();drag={pointerId:e.pointerId,x:e.clientX,y:e.clientY,col:state.view.col,row:state.view.row,moved:false};suppressClick=false;});
$('stage').addEventListener('pointermove',e=>{if(detailDrag&&detailDrag.pointerId===e.pointerId){detailDrag.element.scrollTop=detailDrag.top-(e.clientY-detailDrag.y);rememberReading(detailDrag.element.closest('.block'));return;}if(!drag||drag.pointerId!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<7)return;if(!drag.moved){drag.moved=true;$('stage').setPointerCapture(e.pointerId);}const {scale:s,cellHeight}=CanvasModel.projection(stageWidth,stageHeight,camera);continuous(drag.col-dx/(W*s),drag.row-dy/(cellHeight*s));});
function endDrag(e){if(detailDrag&&detailDrag.pointerId===e.pointerId){detailDrag=null;return;}if(!drag||drag.pointerId!==e.pointerId)return;const moved=drag.moved,origin={col:drag.col,row:drag.row};drag=null;if(moved){suppressClick=true;for(const key of ['col','row']){const delta=state.view[key]-origin[key];if(Math.abs(delta)>.15&&Math.abs(delta)<.5)state.view[key]=origin[key]+Math.sign(delta);}settle();setTimeout(()=>suppressClick=false,0);}}
$('stage').addEventListener('pointerup',endDrag);$('stage').addEventListener('pointercancel',endDrag);$('stage').addEventListener('lostpointercapture',e=>{if(drag)endDrag(e);});
function beginPinch(){
  cancelGesture();stopAnimation();
  pinch={from:{...camera},anchor:CanvasModel.zoomAnchor(camera,scene,stageWidth,stageHeight,state.selected),delta:0};
}
function previewPinch(delta){
  if(!pinch)beginPinch();
  pinch.delta=delta;
  const size=CanvasModel.pinchSize(pinch.from.size,delta);
  camera=CanvasModel.zoomCamera(pinch.from,size);
  draw();updateControls(true);
}
function endPinch(){
  if(!pinch)return;const size=Math.round(camera.size);
  state.view=CanvasModel.zoomView(pinch.anchor,size,scene);
  state.selected=pinch.anchor.id;
  clearTimeout(pinchTimer);pinch=null;nativePinch=false;
  animate();
}
$('stage').addEventListener('wheel',e=>{
  if(e.ctrlKey){e.preventDefault();if(nativePinch)return;if(!pinch)beginPinch();previewPinch(pinch.delta+e.deltaY);clearTimeout(pinchTimer);pinchTimer=setTimeout(endPinch,220);return;}
  if(e.metaKey)return;
  e.preventDefault();if(drag)return;if(pinch)endPinch();
  const time=performance.now(),unit=e.deltaMode===1?20:e.deltaMode===2?stageHeight:1;
  if(readingGesture?.locked&&time-readingGesture.time<CanvasModel.READING_IDLE){readingGesture.time=time;return;}
  if(state.view.size===1&&!cameraMotion&&!layoutMotion&&Math.abs(e.deltaY)>=Math.abs(e.deltaX)&&e.deltaY){
    const node=scene.nodes.find(n=>n.col===state.view.col&&n.row===state.view.row),el=elements.get(node?.id),scroll=el?.querySelector('.card-content');
    if(scroll&&scroll.scrollHeight>scroll.clientHeight+1){
      const gesture=CanvasModel.readingWheel(readingGesture,{id:node.id,delta:e.deltaY,top:scroll.scrollTop,max:scroll.scrollHeight-scroll.clientHeight,time});
      if(gesture.action==='read'){const {scale}=CanvasModel.projection(stageWidth,stageHeight,camera);scroll.scrollTop+=e.deltaY*unit/scale;rememberReading(el);updateReadingHint(el);}
      else if(gesture.action==='pan')pan(0,gesture.direction);
      readingGesture=gesture;return;
    }
  }
  readingGesture=null;
  if(!wheelBase){if(layoutMotion)layoutMotion.endView=null;stopAnimation();wheelBase={...state.view};}
  const {scale:s,cellHeight}=CanvasModel.projection(stageWidth,stageHeight,camera);
  continuous(state.view.col+e.deltaX*unit/(W*s),state.view.row+e.deltaY*unit/(cellHeight*s));
  clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{for(const key of ['col','row']){const delta=state.view[key]-wheelBase[key];if(Math.abs(delta)>.15&&Math.abs(delta)<.5)state.view[key]=wheelBase[key]+Math.sign(delta);}settle();},160);
},{passive:false});
$('stage').addEventListener('gesturestart',e=>{e.preventDefault();beginPinch();nativePinch=true;},{passive:false});
$('stage').addEventListener('gesturechange',e=>{e.preventDefault();if(nativePinch&&Number.isFinite(e.scale)&&e.scale>0)previewPinch(-Math.log(e.scale)/.006);},{passive:false});
$('stage').addEventListener('gestureend',e=>{e.preventDefault();endPinch();},{passive:false});
function resize(){const r=$('stage').getBoundingClientRect();stageWidth=Math.max(120,r.width);stageHeight=Math.max(120,r.height);$('viewport').style.width=stageWidth+'px';$('viewport').style.height=stageHeight+'px';draw();updateControls();}
renderStructure();scene.nodes.forEach(n=>positions.set(n.id,{x:n.col*W,y:n.row*H,opacity:1}));new ResizeObserver(resize).observe($('stage'));resize();updateControls();
})();
</script>
</body>
